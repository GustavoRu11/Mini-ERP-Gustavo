{% extends 'base.html' %}

{% block title %}Eliminar - Mini ERP{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle-fill"></i> Confirmar Eliminación
            </div>
            <div class="card-body text-center p-4">
                <i class="bi bi-trash-fill text-danger" style="font-size: 3rem;"></i>
                <h4 class="mt-3">¿Estás seguro?</h4>
                <p class="text-muted">
                    Estás a punto de eliminar <strong>{{ objeto }}</strong>. 
                    Esta acción no se puede deshacer.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 me-2">
                        <i class="bi bi-trash"></i> Sí, eliminar
                    </button>
                    <a href="javascript:history.back()" class="btn btn-secondary px-4">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
