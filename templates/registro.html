<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Mini ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .registro-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand {
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-sub {
            color: #6c757d;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .btn-registro {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border: none;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-registro:hover {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e9ecef;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: none;
        }
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #6c757d;
        }
        .login-link a {
            color: #0f3460;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="registro-card">
        <div class="brand">
            <i class="bi bi-grid-3x3-gap-fill"></i> Mini ERP
        </div>
        <div class="brand-sub">Crear nueva cuenta</div>

        {% if form.errors %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-circle"></i> 
            Por favor corregí los errores del formulario.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control"
                    placeholder="Elegí un nombre de usuario" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Nombre completo</label>
                <input type="text" name="first_name" class="form-control"
                    placeholder="Tu nombre completo">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control"
                    placeholder="Tu correo electrónico">
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password1" class="form-control"
                    placeholder="Mínimo 8 caracteres" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Confirmar Contraseña</label>
                <input type="password" name="password2" class="form-control"
                    placeholder="Repetí tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-registro">
                <i class="bi bi-person-plus"></i> Crear Cuenta
            </button>
        </form>
        <div class="login-link">
            ¿Ya tenés cuenta? <a href="/login/">Iniciá sesión aquí</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
