<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mini ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand {
            color: #1a1a2e;
            font-weight: 800;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 5px;
        }
        .brand-sub {
            color: #6c757d;
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }
        .btn-login {
            background: linear-gradient(135deg, #1a1a2e, #0f3460);
            border: none;
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e9ecef;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <i class="bi bi-grid-3x3-gap-fill"></i> Mini ERP
        </div>
        <div class="brand-sub">Gestión de Proyectos y Recursos</div>

        {% if form.errors %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-circle"></i> Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario</label>
                <input type="text" name="username" class="form-control"
                    placeholder="Ingresá tu usuario" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control"
                    placeholder="Ingresá tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>
        </form>
        <div class="text-center mt-3" style="color: #6c757d;">
            ¿No tenés cuenta? <a href="/registro/" style="color: #0f3460; font-weight: 600; text-decoration: none;">Registrate aquí</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
