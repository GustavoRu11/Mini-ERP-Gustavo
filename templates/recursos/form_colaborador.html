{% extends 'base.html' %}

{% block title %}{{ accion }} Colaborador - Mini ERP{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-person-plus-fill"></i> {{ accion }} Colaborador</h2>
    <a href="{% url 'lista_colaboradores' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Nombre completo</label>
                    <input type="text" name="nombre" class="form-control"
                        value="{{ colaborador.nombre|default:'' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Puesto</label>
                    <input type="text" name="puesto" class="form-control"
                        value="{{ colaborador.puesto|default:'' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" name="email" class="form-control"
                        value="{{ colaborador.email|default:'' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Teléfono</label>
                    <input type="text" name="telefono" class="form-control"
                        value="{{ colaborador.telefono|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Disponibilidad</label>
                    <select name="disponibilidad" class="form-select">
                        <option value="disponible" {% if colaborador.disponibilidad == 'disponible' %}selected{% endif %}>Disponible</option>
                        <option value="ocupado" {% if colaborador.disponibilidad == 'ocupado' %}selected{% endif %}>Ocupado</option>
                        <option value="vacaciones" {% if colaborador.disponibilidad == 'vacaciones' %}selected{% endif %}>En Vacaciones</option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save"></i> {{ accion }} Colaborador
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
